name: Build (Do Not Use)

on:
  workflow_call:
    inputs:
      version:
        description: Version to inject; defaults to current stable
        required: false
        default: ''
        type: string
      release_tag:
        description: Release tag used in generated artifact URLs
        required: false
        default: dev
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and package portable skill
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          name="$(jq -er '.name' manifest.json)"
          [[ "$name" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "Invalid skill name: $name" >&2; exit 1; }

          version="$REQUESTED_VERSION"
          if [[ -z "$version" ]]; then
            version=0.0.0
            latest_tag="$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // empty')"
            if [[ -n "$latest_tag" ]]; then
              [[ "$latest_tag" =~ ^v[0-9]+.[0-9]+.[0-9]+$ ]] || { echo "Latest stable release tag must be vMAJOR.MINOR.PATCH: $latest_tag" >&2; exit 1; }
              version="${latest_tag#v}"
            fi
          fi
          [[ "$version" =~ ^[0-9]+.[0-9]+.[0-9]+$ ]] || { echo "Build version must be plain semver: $version" >&2; exit 1; }

          jq -e '.skill_files | type == "array" and length > 0 and all(.[]; type == "string" and length > 0)' manifest.json >/dev/null
          jq -e 'has("runtime") | not' manifest.json >/dev/null
          jq -e 'has("runtime_artifacts") | not' manifest.json >/dev/null
          jq -e 'has("runtime_cli") | not' manifest.json >/dev/null

          mapfile -t declared < <(
            jq -r '
              [
                .skill_files[]?,
                .instruction_fragment?,
                ((.harness_resources? // {}) | to_entries[]?.value | to_entries[]?.value[]?)
              ]
              | .[]
              | select(type == "string" and length > 0)
            ' manifest.json
          )

          for path in "${declared[@]}"; do
            test -f "$path"
          done

          rm -rf build
          stage="$PWD/build/package"
          mkdir -p "$stage" "$PWD/build/release"
          cp LICENSE "$stage/"
          jq --arg version "$version" '. + {version: $version}' manifest.json > "$stage/manifest.json"

          for path in "${declared[@]}"; do
            mkdir -p "$stage/$(dirname "$path")"
            cp "$path" "$stage/$path"
          done

          archive="$PWD/build/release/$name.zip"
          (cd "$stage" && zip -q -r "$archive" .)

          sha256="$(sha256sum "$archive" | cut -d' ' -f1)"
          url="https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$name.zip"
          jq             --arg version "$version"             --arg url "$url"             --arg sha256 "$sha256"             '{name, version: $version, description, artifacts: {portable: {url: $url, sha256: $sha256}}}
             + (if has("dependencies") then {dependencies} else {} end)'             manifest.json > build/release/manifest.json

          test -s "$archive"
          jq -e '.artifacts.portable.url and .artifacts.portable.sha256' build/release/manifest.json >/dev/null
          jq -e --slurp '
            .[0].description == .[1].description
            and (.[0].dependencies // null) == (.[1].dependencies // null)
          ' build/release/manifest.json manifest.json >/dev/null

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          if-no-files-found: error
          retention-days: 14
          path: build/release/*
